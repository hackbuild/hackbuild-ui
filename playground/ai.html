<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>hack.build UI ai and 3d layer</title>
  <style>
    /* layout glue, mobile first: one column, the rail beside the work from 901 px */
    html, body { margin: 0 }
    .pg-ai { display: flex; flex-direction: column; min-height: 100vh }
    .pg-work { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--hb-s5); padding: var(--hb-s3) var(--hb-s4) var(--hb-s6) }
    .pg-col { min-width: 0; display: flex; flex-direction: column; gap: var(--hb-s4) }
    .pg-why { margin: var(--hb-s2) 0 0; font-size: 14px; line-height: 1.5 }
    .pg-next { margin: var(--hb-s1) 0 0; font-family: var(--hb-utility); font-size: 11px; color: var(--hb-ink-3) }
    .pg-group { margin-bottom: var(--hb-s3) }
    /* minds: one agent at a time on a phone, both side by side from 901 px */
    .pg-minds[data-show="dog"] [data-agent="moheeb"], .pg-minds[data-show="moheeb"] [data-agent="dog"] { display: none }
    @media (min-width: 641px) { .pg-work { padding: var(--hb-s4) var(--hb-s5) var(--hb-s6) } }
    @media (min-width: 901px) {
      .pg-work { grid-template-columns: minmax(0, 1fr) var(--hb-rail) }
      .pg-minds { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) }
      .pg-minds[data-show] [data-agent] { display: flex }
      .pg-minds .pg-span { grid-column: 1 / -1 }
      .pg-who { display: none }
    }
  </style>
</head>
<body class="hb hb-halftone">
  <div id="app"></div>
  <script type="module" src="/src/ai.ts"></script>
</body>
</html>
