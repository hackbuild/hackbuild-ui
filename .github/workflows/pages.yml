name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # the site at the root, the style guide and kerf replica beside it, the playground under playground/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vite build site --base /hackbuild-ui/ --outDir ../_site --emptyOutDir
      - run: npx vite build playground --base /hackbuild-ui/playground/ --outDir ../_site/playground --emptyOutDir
      - run: |
          cp playground/ai-static.html playground/minds-static.html _site/playground/
          mkdir -p _site/dist && cp -R dist/styles _site/dist/
          cp hackbuild-design-system.html hackbuild-kerf-replica.html _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
